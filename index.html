<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maimii's Birthday Box 🎁</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;font-family:"DM Sans",sans-serif;
  background:linear-gradient(135deg,#fff0e8 0%,#f3eaff 55%,#e7f7ff 100%);
  color:#28232d; display:flex; justify-content:center; padding:28px 16px;
}
.wrap{width:min(820px,100%);text-align:center}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.55}
h1{font-size:clamp(36px,9vw,70px);margin:8px 0 2px;line-height:1}
.subtitle{margin:12px auto 28px;max-width:580px;line-height:1.5;opacity:.72}
.box{
  background:#fff;border:2px solid #28232d;border-radius:26px;padding:20px;
  box-shadow:10px 10px 0 #28232d;text-align:left
}
.shipping{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.stamp{border:1px dashed #777;border-radius:8px;padding:7px 10px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{
  border:2px solid #28232d;border-radius:19px;padding:20px 15px;min-height:145px;
  cursor:pointer;font:inherit;text-align:center;box-shadow:4px 4px 0 #28232d;
  transition:.15s;background:#fff8d9
}
.card:nth-child(2){background:#eaf7ff}
.card:nth-child(3){background:#f3eaff}
.card:nth-child(4){background:#e9f8e9}
.card:nth-child(5){background:#ffe9ef}
.card:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #28232d}
.card .emoji{display:block;font-size:35px;margin-bottom:9px}
.card strong{display:block;font-size:15px}
.card small{display:block;margin-top:6px;opacity:.58}
.secret{
  margin-top:14px;background:#25212a;color:white;box-shadow:4px 4px 0 #bbb;
}
.secret small{color:#ddd}
.footer{text-align:center;font-weight:800;margin:24px 4px 4px}
dialog{
  width:min(650px,calc(100% - 28px));border:2px solid #28232d;border-radius:23px;
  padding:27px;box-shadow:8px 8px 0 #28232d;background:#fff;color:#28232d
}
dialog::backdrop{background:rgba(25,20,30,.58)}
.close{float:right;border:0;background:none;font-size:27px;cursor:pointer}
.modalEmoji{font-size:45px}
.modalTitle{font-size:29px;margin:5px 0 17px}
.message{font-family:"Caveat",cursive;font-size:24px;line-height:1.5;white-space:pre-line}
.media-note{margin-top:18px;padding:14px;border-radius:14px;background:#f5f2f7;font-size:13px}
.media-note b{display:block;margin-bottom:5px}
audio,video{width:100%;margin-top:12px;border-radius:12px}
video{max-height:360px}
.photo{width:100%;max-height:420px;object-fit:contain;border-radius:15px;margin-top:12px}
.secret-message{text-align:center;font-size:19px}
@media(max-width:540px){.grid{grid-template-columns:1fr}.box{padding:15px}.card{min-height:125px}}

/* Three-card laughter department */
.media-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
.media-card{width:100%;border:2px solid #28232d;border-radius:17px;padding:17px 14px;cursor:pointer;font:inherit;color:#28232d;box-shadow:4px 4px 0 #28232d;transition:.15s;text-align:center}
.media-card:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #28232d}
.photo-card{background:#fff0f4}.video-card{background:#eef8ff}.song-card{background:#fff8d9}
.media-icon{display:block;font-size:28px;margin-bottom:7px}.media-card strong{display:block;font-size:15px;line-height:1.35}.media-card small{display:block;margin-top:6px;opacity:.55}
.media-view{margin-top:18px;text-align:center}.media-view h3{margin:10px 0 5px;font-size:20px}.media-view p{margin:0 0 12px;opacity:.72}
.back-button{border:1px solid #777;background:#f5f2f7;border-radius:9px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}
.song-box{margin-top:15px;padding:20px;background:#fff8d9;border-radius:15px}.big-note{font-size:50px;margin-bottom:10px}

</style>
</head>
<body>
<div class="wrap">
  <div class="tag">SPECIAL DELIVERY • HANDLE WITH CARE</div>
  <h1>📦 MAIMII</h1>
  <p class="subtitle">
    For the friend who feels like home. 
  </p>

  <div class="box">
    <div class="shipping">
      <span class="stamp">TO: <b>MAIMII</b></span>
      <span class="stamp">FROM: <b>CHUII</b></span>
      <span class="stamp">STATUS: DELIVERED ❤️ </span>
    </div>

    <div class="grid">
      <button class="card" onclick="openBox(0)">
        <span class="emoji">🫂</span><strong>Open when you miss me</strong>
        <small>geography is the villain</small>
      </button>

      <button class="card" onclick="openBox(1)">
        <span class="emoji">🧠</span><strong>Open when life gets overwhelming</strong>
        <small>for the ambitious human</small>
      </button>

      <button class="card" onclick="openBox(2)">
        <span class="emoji">😂</span><strong>Open when you need to laugh</strong>
        <small>⚠️ questionable material inside</small>
      </button>

      <button class="card" onclick="openBox(3)">
        <span class="emoji">❤️</span><strong>Open when you forget</strong>
        <small>how loved you are</small>
      </button>

      <button class="card" onclick="openBox(4)">
        <span class="emoji">🥂</span><strong>Open on your birthday night</strong>
        <small>final delivery</small>
      </button>

      <button class="card secret" onclick="openSecret()">
        <span class="emoji">🔐</span><strong>DO NOT OPEN UNLESS READY</strong>
        <small>there may be a plot twist</small>
      </button>
    </div>

    <div class="footer">PACKAGE CLOSED. BEST FRIEND: NON-RETURNABLE❤️</div>
  </div>
</div>

<dialog id="modal">
  <button class="close" onclick="modal.close()">×</button>
  <div class="modalEmoji" id="mEmoji"></div>
  <div class="message" id="mMessage"></div>
  <div id="media"></div>
</dialog>

<script>
const PHOTO_FILE = "maimii_embarrassing_photo.jpg";
const VIDEO_FILE = "maimii_laugh.mp4";
const SONG_FILE  = "maimii_song.mp3";

const boxes = [
{emoji:"🫂",title:"Open when you miss me",message:`So you've finally admitted that you miss me. Interesting!!

Unfortunately, teleportation technology has failed us again.

But until the lab nerds fix that, remember this:
you’re still one of my best people, no matter the miles.

We’ll be in the same room again before you know it.❤️`},
{emoji:"🧠",title:"Open when life gets overwhelming",message:`Hey ambitious human,

You don’t have to conquer the world today!

<b> One goal. One thing in front of you. One day at a time .</b>

And if you’ve forgotten: you’re already doing better than you think.Your only job is to be gentle with yourself and keep showing up. The rest will follow.

Now go drink some water and stop trying to solve your entire existence at 2 AM.

You’re allowed to rest. You’re allowed to be a work in progress.❤️`},
{emoji:"😂",title:"Open when you need to laugh",message:`🚨 EMERGENCY LAUGHTER PROTOCOL ACTIVATED 🚨

Your current level of seriousness has become unacceptable.

I have therefore prepared a highly classified three-part investigation into your crimes against dignity.

Choose your evidence wisely. 😈`},
{emoji:"❤️",title:"Open when you forget how loved you are",message:`Maimiiduuu,

You're one of those people who makes life lighter without even trying.
Funny, warm, ridiculously outgoing, but somehow still so grounded and humble. I hope you never lose that part of yourself.

Keep chasing the things you want. Keep growing. Keep being curious. Keep that little spiritual part of you that reminds you there's more to life than whatever is stressing you out today.

And remember, somewhere out there, there's this person who is ridiculously grateful that you're in their life.❤️`},
{emoji:"🥂",title:"Open on your birthday night",message:`MAIMII HAS SUCCESSFULLY UNLOCKED ANOTHER YEAR. 🎉

+1 year of wisdom
+365 days of character development
+∞ spiritual growth
+∞ reasons to laugh

May this year take you closer to every goal you've been quietly working towards.
I wish you nothing but the absolute best for everything that’s ahead. May life give you countless beautiful memories, crazy adventures, people who love you deeply, and enough unexpected moments to keep things interesting.
And beyond everything life brings your way, I hope you continue to grow spiritually, understand yourself more deeply and become the highest version of yourself. 
You have so much potential and I genuinely hope you get to experience every bit of it.

Keep laughing, keep being your crazy self, keep spreading that good energy and never lose that beautiful heart of yours.
Here’s to an amazing future and a life full of stories worth telling.

I love you and I’m always rooting for you. Happy birthday Maimiiii.❤️`}
];

function openBox(i){
  document.getElementById("mEmoji").textContent=boxes[i].emoji;
  document.getElementById("mMessage").innerHTML=boxes[i].message;
  document.getElementById("media").innerHTML="";

  if(i===2){
    document.getElementById("mEmoji").textContent="😂";
    document.getElementById("mMessage").textContent="Three pieces of highly classified evidence await you. Choose carefully. 😈";
    
    document.getElementById("media").innerHTML=`
      <div class="media-grid">
        <button class="media-card photo-card" onclick="showMedia('photo')">
          <span class="media-icon">📸</span><strong>Why should boys have all the fun</strong><small>Evidence #01</small>
        </button>
        <button class="media-card video-card" onclick="showMedia('video')">
          <span class="media-icon">😂</span><strong>Laughing like this is normal behavior 😉</strong><small>Evidence #02</small>
        </button>
        <button class="media-card song-card" onclick="showMedia('song')">
          <span class="media-icon">🌟</span><strong>For the birthday star who shines even off-key 🌟😄</strong><small>Evidence #03</small>
        </button>
      </div>`;
  }
  document.getElementById("modal").showModal();
}

function showMedia(type){
  const media=document.getElementById("media");
  if(type==="photo") media.innerHTML=`
    <div class="media-view"><button class="back-button" onclick="openBox(2)">← Back to the three cards</button>
    <h3>📸 Evidence #01</h3><p>Why should boys have all the fun 😌</p>
    <img class="photo" src="${PHOTO_FILE}" alt="Maimii's embarrassing photo"></div>`;
  if(type==="video") media.innerHTML=`
    <div class="media-view"><button class="back-button" onclick="openBox(2)">← Back to the three cards</button>
    <h3>😂 Evidence #02</h3><p>Laughing like this is normal behavior 😉</p>
    <video controls playsinline preload="metadata" src="${VIDEO_FILE}"></video></div>`;
  if(type==="song") media.innerHTML=`
    <div class="media-view"><button class="back-button" onclick="openBox(2)">← Back to the three cards</button>
    <h3>🌟 Evidence #03</h3><p>For the birthday star who shines even off-key 🌟😄</p>
    <div class="song-box"><div class="big-note">🎵</div><audio controls src="${SONG_FILE}"></audio></div></div>`;
}

function openSecret(){
  document.getElementById("mEmoji").textContent="🔐";
  document.getElementById("mMessage").textContent=`Oh no!
  
There was a warning. A very clear one and yet, here we are!

I'm not entirely sure what you were expecting to find in here, but just to manage expectations: no money, no fancy vacation, and unfortunately, my current technological abilities don't include teleporting you to a luxury resort either. 😂

There is, however...ME. And unfortunately for you, that's a lifetime subscription. No cancellations. No refunds!

But since you've made it this far, I might as well tell you something a little more serious.

<b> Life is going to take you places you can't even imagine right now. You're going to chase things you once thought were impossible, meet people who change you, make questionable decisions, get things spectacularly wrong, figure yourself out and then probably question everything all over again.
I hope you find yourself saying “I can't believe this is actually my life” a little more often and for all the right reasons.
So here's to another year of you being ridiculously outgoing, lovable, occasionally questionable, spiritually curious and somehow still wonderfully grounded through all of it.</b>

Please don't become too wise though, I still need someone who will make questionable decisions with me.

Keep laughing. Keep that good energy. Keep your beautiful heart❤️

And when life inevitably decides to throw a plot twist at you, I hope you remember that somewhere out there is a person who will be cheering for you, laughing with you, listening and giving you all the goss, and probably encouraging at least 30% of your bad ideas.ALWAYS!`;
  document.getElementById("media").innerHTML="";
  document.getElementById("modal").showModal();
}
</script>
</body>
</html>
